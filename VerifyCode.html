
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="SignUpAndLoginStyle.css">
    <title>Verify Your Email - Pixels pixelated</title>
</head>
<body>
    <div class="wrapper">
        <h1>Verify Email</h1>
        <p id="text"> You have 2 minutes to enter your code</p>
        <p id="error-message"></p>
        <form id="verify-form">
            <div>
                <label for="code-input">
                    <span>#</span>
                </label>
                <input type="text" id="code-input" placeholder="Enter 4-digit code" maxlength="4" required>
            </div>
            <button type="submit" id="verify-button" >Verify Code</button>
        </form>
    </div>

    <script src="VerifyCode.js"></script>
</body>
</html>
