<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="dashboard.css">
    <title>Pixels Pixelated - Dashboard</title>
</head>
<body>

    <!-- Profile Button fixed at the top right corner of the page -->
    <button class="top-right-profile-btn" onclick="openProfileModal()">PROFILE</button>

    <div class="dashboard-card">
        <div class="dashboard-header">
            <h1>Workspace</h1>
            <div class="header-buttons">
                <button class="close-btn" onclick="closeDashboard()">CLOSE</button>
                <button class="logout-btn" onclick="logout()">LOGOUT</button>
            </div>
        </div>

        <div class="dashboard-content">
            <h2>Welcome Back!</h2>
            <p>You have successfully logged into your pixel workspace.</p>
            <p id="user-display-email"></p>
        </div>
    </div>

    <!-- Edit Profile Modal -->
    <div id="profile-modal" class="modal" style="display: none;">
        <div class="modal-content">
            <h3>Edit Profile</h3>
            <label for="edit-email">Email:</label>
            <input type="email" id="edit-email">
            
            <div class="modal-buttons">
                <button class="save-btn" onclick="saveProfile()">Save</button>
                <button class="cancel-btn" onclick="closeProfileModal()">Cancel</button>
            </div>
        </div>
    </div>

    <script src="dashboard.js"></script>
</body>
</html>
