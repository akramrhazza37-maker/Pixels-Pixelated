<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!----======= CSS ======= -->
    <link rel="stylesheet" href="dashboard.css">


    <!----======= Boxicons CSS ======= -->
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>

    <title>Pixels Pixelated Dashboard</title>
</head>
<body>
    <nav class="sidebar">
        <header>
            <div class="image-text">
                <span class="image">
                    <img src="profile.png" alt="logo">
                </span>

                <div class="text header-text">
                    <span class="name">Guest</span>
                    <span class="rank">New</span>
                </div>
            </div>

            <i class="bx bx-chevron-right toggle"></i>
        </header>

        <div class="menu-bar">
            <div class="menu">
                <li class="search-box">
                    <i class="bx bx-search icon" ></i>
                    <input type="search" placeholder="Search...">
                </li>
                <ul class="menu-links">
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-home-alt icon" ></i>
                            <span class="text nav-text">Dashboard</span>
                        </a>
                    </li>
                
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-code-alt icon" ></i>
                            <span class="text nav-text">Code</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-book icon" ></i>
                            <span class="text nav-text">Learn</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-group icon" ></i>
                            <span class="text nav-text">Collaborate</span>
                            <i class='bx bxs-crown icon' ></i>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-trophy icon" ></i>
                            <span class="text nav-text"> Leaderboard </span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bxs-crown icon" ></i>
                            <span class="text nav-text">Premium</span>
                        </a>
                    </li>
                    <li class="nav-link">
                        <a href="#">
                            <i class="bx bx-user-circle icon" ></i>
                            <span class="text nav-text">Profile</span>
                        </a>
                    </li>
                </ul>
            </div>
            <div class="bottom-content">
                <li class="">
                    <a href="#">
                        <i class="bx bx-log-out icon" ></i>
                        <span class="text nav-text">Logout</span>
                    </a>
                </li>

                <li class="mode">
                    <div class="moon-sun">
                        <i class="bx bx-moon icon moon"></i>
                        <i class="bx bx-sun icon sun"></i>
                    </div>
                    <span class="mode-text text">Dark Mode</span>

                    <div class="toggle-switch">
                        <span class="switch"></span>
                    </div>

                </li>

            </div>
        </div>
    </nav>

    <script src="dashboard.js"></script>

</body>
</html>
