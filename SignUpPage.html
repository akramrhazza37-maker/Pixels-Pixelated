<html> <!-- The root element of the HTML document -->

    <!-- The head section of the HTML document -->
    <head>

        <link rel="stylesheet" href="SignUpAndLoginStyle.css"> <!-- Link to the external CSS file -->


        <title>Pixels pixelated</title> <!-- The title of the HTML document -->

    </head>

    <!-- The body section of the HTML document -->
    <body>

        <script type = "text/javascript" src = "SignUpAndLoginScript.js"defer></script> <!-- Link to the external JavaScript file -->

        <div class = "wrapper">
            <h1>SignUp</h1>
            <p id="error-message"></p>
            <form id = "form">

                </div>

                <div>
                    <label for = "Email-input">
                        <span>@</span>
                    </label>
                    <input type = "email" name = "Email" id = "Email-input" placeholder = "Email">
                </div>

                <div>
                    <label for = "Password-input"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg></label>
                    <input type = "password" name = "Password" id = "Password-input" placeholder = "Password">
                </div>

                <div>
                    <label for = "Confirm-password-input"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960" width="24px" fill="#e3e3e3"><path d="M240-80q-33 0-56.5-23.5T160-160v-400q0-33 23.5-56.5T240-640h40v-80q0-83 58.5-141.5T480-920q83 0 141.5 58.5T680-720v80h40q33 0 56.5 23.5T800-560v400q0 33-23.5 56.5T720-80H240Zm296.5-223.5Q560-327 560-360t-23.5-56.5Q513-440 480-440t-56.5 23.5Q400-393 400-360t23.5 56.5Q447-280 480-280t56.5-23.5ZM360-640h240v-80q0-50-35-85t-85-35q-50 0-85 35t-35 85v80Z"/></svg></label>
                    <input type = "password" name = "Repeat-password" id = "Confirm-password-input" placeholder = "Confirm Password">
                </div>
                
                <button type = "submit">Signup Now!</button>
            </form>
            <p>Already have an Account? <a href = "LoginPage.html">Login instead!</a></p>
        </div>

    </body>

</html>
